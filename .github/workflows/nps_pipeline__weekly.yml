name: NPS Weekly Data Fetch

on:
  schedule:
    - cron: '0 8 * * 0'  # Sundays at 8am UTC
  workflow_dispatch:
    inputs:
      rate_hikes_args:
        description: 'Extra args for rate_hikes.py (e.g. "--limit 2 --dry-run")'
        required: false
        default: ''

jobs:
  fetch:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-cloud-bigquery

      - name: Run weekly NPS data fetch
        env:
          NPS_KEY: ${{ secrets.NPS_KEY }}
          PROJECT_ID: ${{ secrets.PROJECT_ID }}
          DATASET_ID: ${{ secrets.DATASET_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GET_NATIONAL_PARKS_QUERY: ${{ secrets.GET_NATIONAL_PARKS_QUERY }}
        run: python scripts/fetch_nps_data__weekly.py

  rate-hikes:
    runs-on: ubuntu-latest
    needs: fetch
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-cloud-bigquery requests pandas db-dtypes

      - name: Rate hike difficulty
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          PROJECT_ID: ${{ secrets.PROJECT_ID }}
          DATASET_ID: ${{ secrets.DATASET_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          RATE_HIKES_ARGS: ${{ inputs.rate_hikes_args }}
        run: python scripts/rate_hikes.py $RATE_HIKES_ARGS

  categorize-lengths:
    runs-on: ubuntu-latest
    needs: fetch
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-cloud-bigquery anthropic pandas db-dtypes

      - name: Categorize hike lengths
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PROJECT_ID: ${{ secrets.PROJECT_ID }}
          DATASET_ID: ${{ secrets.DATASET_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: python scripts/categorize_hike_lengths.py