name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Same install the pipeline workflows use, so a missing dependency
      # fails here on the PR instead of at 8am on a Sunday.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pyyaml

      - name: Lint
        # Error-class rules only: syntax errors and undefined/unused names.
        # Style rules are deliberately not gated so legacy scripts don't
        # block unrelated PRs.
        run: ruff check scripts/ --select E9,F63,F7,F82,F401

      - name: Compile all scripts
        # Scripts build BigQuery clients at import time, so they can't be
        # imported without credentials; compileall catches syntax breakage.
        run: python -m compileall -q scripts/

      - name: Validate workflow YAML
        run: |
          python - <<'PY'
          import pathlib, sys, yaml
          failed = False
          for p in sorted(pathlib.Path(".github/workflows").glob("*.yml")):
              try:
                  yaml.safe_load(p.read_text())
                  print(f"ok   {p}")
              except yaml.YAMLError as exc:
                  print(f"FAIL {p}: {exc}")
                  failed = True
          sys.exit(1 if failed else 0)
          PY
